<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 40px 15px;
            color: #222;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px #00000012;
        }

        h1 { margin-top: 0; }

        form, .filters, .pagination {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"], select {
            flex: 1;
            min-width: 130px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover:not(:disabled) {
            opacity: 0.85;
        }

        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .task-title {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: #888;
        }

        .delete { background: #dc2626; }
        .edit { background: #64748b; }

        .error { color: #dc2626; }

        .empty {
            color: #888;
            text-align: center;
            padding: 20px;
        }

        .pagination {
            justify-content: center;
            margin-top: 25px;
        }

        .pagination select {
            flex: 0;
            min-width: 75px;
        }

        @media (max-width: 500px) {
            li { flex-wrap: wrap; }
            .task-title { min-width: 70%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Менеджер задач</h1>

    <form id="taskForm">
        <input type="text" id="taskInput"
               placeholder="Введите новую задачу"
               maxlength="200" required>
        <button type="submit">Добавить</button>
    </form>

    <h2>Поиск и фильтрация</h2>

    <div class="filters">
        <input type="text" id="searchInput"
               placeholder="Поиск по названию">

        <select id="statusFilter">
            <option value="all">Все задачи</option>
            <option value="active">Активные</option>
            <option value="completed">Выполненные</option>
        </select>

        <button id="applyButton">Применить</button>
    </div>

    <p id="error" class="error" role="alert"></p>

    <h2>Список задач</h2>
    <ul id="taskList"></ul>

    <p id="emptyMessage" class="empty" hidden>
        Задачи не найдены
    </p>

    <div class="pagination">
        <button id="prevButton">Назад</button>
        <span id="pageInfo">Страница 1</span>
        <button id="nextButton">Вперёд</button>

        <label for="limitSelect">На странице:</label>
        <select id="limitSelect">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
        </select>
    </div>
</div>

<script>
    const taskList = document.getElementById("taskList");
    const taskInput = document.getElementById("taskInput");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const errorBox = document.getElementById("error");
    const emptyMessage = document.getElementById("emptyMessage");

    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const pageInfo = document.getElementById("pageInfo");
    const limitSelect = document.getElementById("limitSelect");

    let currentQuery = "";
    let currentStatus = "all";
    let currentPage = 1;
    let currentLimit = 10;
    let totalPages = 0;

    function showError(message) {
        errorBox.textContent = message;
    }

    async function apiRequest(url, options = {}) {
        const response = await fetch(url, options);
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Ошибка сервера");
        }

        return data;
    }

    async function loadTasks() {
        try {
            showError("");

            const params = new URLSearchParams({
                q: currentQuery,
                status: currentStatus,
                page: currentPage,
                limit: currentLimit
            });

            const data = await apiRequest(
                "/api/tasks?" + params.toString()
            );

            if (data.total_pages > 0 &&
                currentPage > data.total_pages) {
                currentPage = data.total_pages;
                return loadTasks();
            }

            if (data.total_pages === 0) {
                currentPage = 1;
            }

            totalPages = data.total_pages;
            taskList.innerHTML = "";

            emptyMessage.hidden = data.items.length !== 0;

            data.items.forEach(task => {
                const li = document.createElement("li");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;

                const title = document.createElement("span");
                title.textContent = task.title;
                title.className = "task-title";

                if (task.completed) {
                    title.classList.add("completed");
                }

                const editButton = document.createElement("button");
                editButton.textContent = "Изменить";
                editButton.className = "edit";

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Удалить";
                deleteButton.className = "delete";

                checkbox.addEventListener("change", async () => {
                    await updateTask(task.id, {
                        completed: checkbox.checked
                    });
                });

                editButton.addEventListener("click", async () => {
                    const newTitle = prompt(
                        "Новое название задачи:",
                        task.title
                    );

                    if (newTitle === null) return;

                    await updateTask(task.id, {
                        title: newTitle
                    });
                });

                deleteButton.addEventListener("click", async () => {
                    if (!confirm("Удалить задачу?")) return;

                    try {
                        await apiRequest("/api/tasks/" + task.id, {
                            method: "DELETE"
                        });

                        await loadTasks();
                    } catch (error) {
                        showError(error.message);
                    }
                });

                li.append(
                    checkbox,
                    title,
                    editButton,
                    deleteButton
                );

                taskList.appendChild(li);
            });

            pageInfo.textContent =
                "Страница " + currentPage +
                " из " + totalPages +
                " (всего: " + data.total + ")";

            prevButton.disabled = currentPage <= 1;
            nextButton.disabled =
                totalPages === 0 || currentPage >= totalPages;

        } catch (error) {
            showError(error.message);
        }
    }

    async function updateTask(id, data) {
        try {
            await apiRequest("/api/tasks/" + id, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            await loadTasks();
        } catch (error) {
            showError(error.message);
        }
    }

    document.getElementById("taskForm")
        .addEventListener("submit", async event => {
            event.preventDefault();

            try {
                await apiRequest("/api/tasks", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: taskInput.value
                    })
                });

                taskInput.value = "";
                await loadTasks();
            } catch (error) {
                showError(error.message);
            }
        });

    document.getElementById("applyButton")
        .addEventListener("click", () => {
            currentQuery = searchInput.value.trim();
            currentStatus = statusFilter.value;
            currentPage = 1;
            loadTasks();
        });

    prevButton.addEventListener("click", () => {
        if (currentPage > 1) {
            currentPage--;
            loadTasks();
        }
    });

    nextButton.addEventListener("click", () => {
        if (currentPage < totalPages) {
            currentPage++;
            loadTasks();
        }
    });

    limitSelect.addEventListener("change", () => {
        currentLimit = Number(limitSelect.value);
        currentPage = 1;
        loadTasks();
    });

    loadTasks();
</script>
</body>
</html>
